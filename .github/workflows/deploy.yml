name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-not-for-production-use' }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-test-refresh-secret-not-for-production-use' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Start MongoDB Replica Set
        run: |
          docker run --name mongodb -d -p 27017:27017 mongo:7.0 mongod --replSet rs0
          sleep 5
          docker exec mongodb mongosh --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          sleep 5
          # MongoDB's default lock-wait for multi-document transactions is
          # only 5ms — plenty on a dedicated dev machine, but CI's shared
          # runners are slow/noisy enough that legitimate (non-deadlocked)
          # lock acquisitions routinely miss that window, failing tests
          # that use transactions (e.g. OrdersService.create) with
          # "Unable to acquire IX lock ... within 5ms". Raise it generously.
          docker exec mongodb mongosh --eval 'db.adminCommand({setParameter: 1, maxTransactionLockRequestTimeoutMillis: 5000})'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Linter
        run: pnpm run lint

      - name: Type Check
        run: pnpm run type-check

      - name: Seed Database
        run: pnpm run --filter @bharatsales/api seed

      - name: Run Tests
        run: pnpm run test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Application
        run: pnpm run build
