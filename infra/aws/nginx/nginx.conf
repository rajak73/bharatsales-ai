user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	gzip on;

    # Admin Dashboard (React + Vite static build, web container on 127.0.0.1:6003)
	server {
		listen 80;
		server_name admin.yourdomain.com;
        
        # Will be updated by Certbot for HTTPS

		location / {
			proxy_pass http://127.0.0.1:6003;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection 'upgrade';
			proxy_set_header Host $host;
			proxy_cache_bypass $http_upgrade;
		}
	}

    # API Server (Node.js + Express, api container on 127.0.0.1:6002)
	server {
		listen 80;
		server_name api.yourdomain.com;

		location / {
			proxy_pass http://127.0.0.1:6002;
			# Server-Sent Events (GET /live-map/stream) must not be buffered.
			proxy_buffering off;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			client_max_body_size 6m;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection 'upgrade';
			proxy_set_header Host $host;
			proxy_cache_bypass $http_upgrade;
		}
	}
}
